name: Final PR 1415 occurrence verification

on:
  push:
    branches:
      - repair/pr1415-maintainer-review
    paths:
      - .github/workflows/verify-pr1415-occurrence-final.yml

permissions:
  contents: read

concurrency:
  group: final-pr1415-occurrence-verification
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        mode: [tests-vet, race, bench]
    steps:
      - name: Check out immutable patch source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: patch-source
          persist-credentials: false
          fetch-depth: 1
      - name: Check out exact PR head
        uses: actions/checkout@v5
        with:
          ref: 09b43810514e9b511dd0ba4156ea655f1c379621
          path: target
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.6
          cache: true
          cache-dependency-path: target/go.sum
      - name: Verify and apply exact patch
        env:
          EXPECTED_BASE: 09b43810514e9b511dd0ba4156ea655f1c379621
          EXPECTED_XZ_SHA256: eff1c1c16ab34dd350a91ea86c09642531c4f4875fcb2152cd713b884325b8d6
          EXPECTED_PATCH_SHA256: 45f6a2f178648f10c86834d8e13a8a872019b5e3978994f0564c4490b837ba0c
          EXPECTED_TREE: ff0a5674226cb8110ae193510bf0cf80b204b0b7
        run: |
          set -euo pipefail
          cat patch-source/.github/pr1415/patches/occurrence-fixes.xz.b64.part.* > /tmp/pr1415.patch.xz.b64
          base64 --decode /tmp/pr1415.patch.xz.b64 > /tmp/pr1415.patch.xz
          echo "$EXPECTED_XZ_SHA256  /tmp/pr1415.patch.xz" | sha256sum --check --strict
          xz --decompress --stdout /tmp/pr1415.patch.xz > /tmp/pr1415.patch
          echo "$EXPECTED_PATCH_SHA256  /tmp/pr1415.patch" | sha256sum --check --strict
          cd target
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          git apply --check /tmp/pr1415.patch
          git apply /tmp/pr1415.patch
          git diff --check
          actual_paths="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          expected_paths="$(cat <<'PATHS' | sort
          internal/db/db_test.go
          internal/db/messages.go
          internal/db/messages_diff.go
          internal/db/schema.sql
          internal/db/sessions.go
          internal/db/signal_maintenance.go
          internal/parser/codex.go
          internal/parser/codex_checkpoint_test.go
          internal/parser/codex_collecting_sink.go
          internal/parser/codex_cursor.go
          internal/parser/codex_cursor_test.go
          internal/parser/codex_parser_test.go
          internal/parser/codex_provider_test.go
          internal/parser/codex_seed_sink.go
          internal/parser/codex_sink.go
          internal/parser/types.go
          internal/signals/incremental.go
          internal/signals/incremental_test.go
          internal/sync/checkpoint_review_test.go
          internal/sync/codex_staging.go
          internal/sync/codex_staging_test.go
          internal/sync/engine.go
          internal/sync/signal_maintain.go
          internal/sync/signal_maintain_test.go
          PATHS
          )"
          test "$actual_paths" = "$expected_paths"
          test -z "$(gofmt -l $actual_paths)"
          git add --all
          actual_tree="$(git write-tree)"
          echo "actual tree:   $actual_tree"
          echo "expected tree: $EXPECTED_TREE"
          test "$actual_tree" = "$EXPECTED_TREE"
      - name: Restore generated inputs
        working-directory: target
        run: |
          set -euo pipefail
          mkdir -p internal/pricing/snapshot
          curl --fail --location \
            https://raw.githubusercontent.com/kenn-io/agentsview/db257992fb8e3048af8c1cec9da738c28b4fe603/litellm_snapshot.json.gz \
            --output internal/pricing/snapshot/litellm_snapshot.json.gz
          echo '0e89b636ccf858edbf95a3f6188476b6eab6cf21f66d16a65c2184229ef81cbe  internal/pricing/snapshot/litellm_snapshot.json.gz' | sha256sum --check --strict
          make sqlite-vec-header
      - name: Complete four-package tests and vet
        if: matrix.mode == 'tests-vet'
        working-directory: target
        run: |
          set -euo pipefail
          go test -tags fts5 \
            ./internal/parser ./internal/db ./internal/signals ./internal/sync \
            -count=1 -timeout=30m
          go vet -tags fts5 \
            ./internal/parser ./internal/db ./internal/signals ./internal/sync
      - name: Race detector
        if: matrix.mode == 'race'
        working-directory: target
        run: |
          set -euo pipefail
          go test -race -tags fts5 \
            ./internal/parser ./internal/db ./internal/signals ./internal/sync \
            -count=1 -timeout=30m
      - name: Complete performance gate
        if: matrix.mode == 'bench'
        working-directory: target
        run: make bench-gate
