name: Desktop Artifacts

# Upstream uses its main-pinned managed workflow. Forks use their local runner
# routing so desktop builds do not wait for an upstream-only Namespace fleet.
on:
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'frontend/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/desktop-artifacts.yml'
      - '.github/actions/build-desktop-artifact/**'
      - '.github/workflows/desktop-artifacts-pr.yml'
permissions: read-all

jobs:
  run:
    if: github.repository == 'kenn-io/agentsview'
    uses: kenn-io/agentsview/.github/workflows/desktop-artifacts.yml@main

  fork:
    if: github.repository != 'kenn-io/agentsview'
    uses: ./.github/workflows/desktop-artifacts.yml
