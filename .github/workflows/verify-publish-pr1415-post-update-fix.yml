name: Verify and publish PR 1415 unified repair

on:
  push:
    branches:
      - repair/pr1415-post-update-unified-fix
    paths:
      - .github/workflows/verify-publish-pr1415-post-update-fix.yml

permissions:
  contents: read
  statuses: write

concurrency:
  group: verify-publish-pr1415-post-update-fix
  cancel-in-progress: true

env:
  BASE_SHA: 08f90dd51ac68c3e3dc73ba6a9551a3f1e689319
  PATCH_SHA256: 475a3fbe15650c2580cb3cc6599f825f25e1598e7b5278c283899c40d076e393
  PATCH_XZ_SHA256: 141f250e181000ec35b8c5684bc7ddee611a4d7d9118bf303330c0c16097108d
  SNAPSHOT_SHA256: 0e89b636ccf858edbf95a3f6188476b6eab6cf21f66d16a65c2184229ef81cbe

jobs:
  verify:
    name: ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: [tests-vet, race, full-repo, bench]
    steps:
      - name: Check out immutable patch source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: patch-source
          fetch-depth: 1
          persist-credentials: false
      - name: Check out exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ env.BASE_SHA }}
          path: target
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: target/go.mod
          cache: true
          cache-dependency-path: target/go.sum
      - name: Verify and apply immutable patch
        run: |
          set -euo pipefail
          base64 --decode \
            patch-source/.github/pr1415/patches/post-update-unified.patch.xz.b64 \
            > /tmp/pr1415.patch.xz
          echo "$PATCH_XZ_SHA256  /tmp/pr1415.patch.xz" | sha256sum --check --strict
          xz --decompress --stdout /tmp/pr1415.patch.xz > /tmp/pr1415.patch
          echo "$PATCH_SHA256  /tmp/pr1415.patch" | sha256sum --check --strict
          cd target
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git apply --check /tmp/pr1415.patch
          git apply /tmp/pr1415.patch
          git diff --check
          actual_paths="$(git diff --name-only | sort)"
          expected_paths="$(cat <<'PATHS' | sort
          internal/db/signal_maintenance.go
          internal/db/signal_snapshot_test.go
          internal/db/staged_content.go
          internal/db/staged_content_test.go
          internal/parser/codex.go
          internal/parser/codex_provider_test.go
          internal/signals/incremental.go
          internal/signals/incremental_test.go
          internal/sync/engine.go
          internal/sync/signal_maintain.go
          internal/sync/signal_maintain_test.go
          PATHS
          )"
          test "$actual_paths" = "$expected_paths"
          test -z "$(gofmt -l $actual_paths)"
      - name: Restore exact generated inputs
        working-directory: target
        run: |
          set -euo pipefail
          mkdir -p internal/pricing/snapshot
          curl --fail --location \
            https://raw.githubusercontent.com/kenn-io/agentsview/db257992fb8e3048af8c1cec9da738c28b4fe603/litellm_snapshot.json.gz \
            --output internal/pricing/snapshot/litellm_snapshot.json.gz
          echo "$SNAPSHOT_SHA256  internal/pricing/snapshot/litellm_snapshot.json.gz" | sha256sum --check --strict
          make sqlite-vec-header
      - name: Four-package tests and vet
        if: matrix.mode == 'tests-vet'
        working-directory: target
        run: |
          set -euo pipefail
          export CGO_CFLAGS="-I$PWD/.sqlite-include"
          go test -tags fts5 \
            ./internal/parser ./internal/db ./internal/signals ./internal/sync \
            -count=1 -timeout=40m
          go vet -tags fts5 \
            ./internal/parser ./internal/db ./internal/signals ./internal/sync
      - name: Four-package race detector
        if: matrix.mode == 'race'
        working-directory: target
        run: |
          set -euo pipefail
          export CGO_CFLAGS="-I$PWD/.sqlite-include"
          go test -race -tags fts5 \
            ./internal/parser ./internal/db ./internal/signals ./internal/sync \
            -count=1 -timeout=45m
      - name: Full repository tests
        if: matrix.mode == 'full-repo'
        working-directory: target
        run: |
          set -euo pipefail
          export CGO_CFLAGS="-I$PWD/.sqlite-include"
          go test -tags fts5 ./... -count=1 -timeout=50m
      - name: Complete benchmark gate
        if: matrix.mode == 'bench'
        working-directory: target
        run: |
          set -euo pipefail
          export CGO_CFLAGS="-I$PWD/.sqlite-include"
          make bench-gate
      - name: Publish verification status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          MODE: ${{ matrix.mode }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          state=failure
          description="PR 1415 $MODE verification failed"
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description="PR 1415 $MODE verification passed"
          fi
          curl --fail-with-body \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/$SOURCE_SHA" \
            --data "$(jq -n \
              --arg state "$state" \
              --arg target_url "$RUN_URL" \
              --arg description "$description" \
              --arg context "pr1415-post-update/$MODE" \
              '{state:$state,target_url:$target_url,description:$description,context:$context}')"

  publish:
    name: Fast-forward PR branch
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      statuses: write
    steps:
      - name: Check out immutable patch source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: patch-source
          fetch-depth: 1
          persist-credentials: false
      - name: Check out exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ env.BASE_SHA }}
          path: target
          fetch-depth: 0
          persist-credentials: true
      - name: Commit tested tree and fast-forward push
        working-directory: target
        run: |
          set -euo pipefail
          base64 --decode \
            ../patch-source/.github/pr1415/patches/post-update-unified.patch.xz.b64 \
            > /tmp/pr1415.patch.xz
          echo "$PATCH_XZ_SHA256  /tmp/pr1415.patch.xz" | sha256sum --check --strict
          xz --decompress --stdout /tmp/pr1415.patch.xz > /tmp/pr1415.patch
          echo "$PATCH_SHA256  /tmp/pr1415.patch" | sha256sum --check --strict
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git fetch origin refs/heads/stack/5-codex-staged-imports
          test "$(git rev-parse FETCH_HEAD)" = "$BASE_SHA"
          git config core.hooksPath /dev/null
          git apply --check /tmp/pr1415.patch
          git apply /tmp/pr1415.patch
          git diff --check
          git add \
            internal/db/signal_maintenance.go \
            internal/db/signal_snapshot_test.go \
            internal/db/staged_content.go \
            internal/db/staged_content_test.go \
            internal/parser/codex.go \
            internal/parser/codex_provider_test.go \
            internal/signals/incremental.go \
            internal/signals/incremental_test.go \
            internal/sync/engine.go \
            internal/sync/signal_maintain.go \
            internal/sync/signal_maintain_test.go
          test -z "$(git status --short | grep '^??' || true)"
          git config user.name Shinn
          git config user.email 453821056@qq.com
          git commit \
            -m "fix(sync): refresh derived state from coherent inputs" \
            -m "Guard full signal publication with every session-row input consumed by recomputation, and refresh automation, signals, findings, rule versions, markers, and checkpoints when staged transcript content is unchanged." \
            -m "Normalize mutable incremental-state maps after decode and keep zero-turn Codex parents unresolved until replay filtering can be proven."
          git push origin HEAD:refs/heads/stack/5-codex-staged-imports
      - name: Publish release status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          state=failure
          description="PR 1415 fast-forward publication failed"
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description="PR 1415 tested repair published"
          fi
          curl --fail-with-body \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/$SOURCE_SHA" \
            --data "$(jq -n \
              --arg state "$state" \
              --arg target_url "$RUN_URL" \
              --arg description "$description" \
              --arg context pr1415-post-update/publish \
              '{state:$state,target_url:$target_url,description:$description,context:$context}')"
