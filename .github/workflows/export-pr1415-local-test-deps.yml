name: Export PR 1415 local test dependencies

on:
  push:
    branches:
      - repair/pr1415-maintainer-review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      GOMODCACHE: /tmp/pr1415-gomodcache
      GOCACHE: /tmp/pr1415-gocache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.6
          cache: false
      - name: Assemble isolated module cache
        run: |
          set -euo pipefail
          mkdir -p "$GOMODCACHE" "$GOCACHE"
          go mod download
          tar -C /tmp -czf /tmp/gomodcache.tar.gz pr1415-gomodcache
          sha256sum /tmp/gomodcache.tar.gz > /tmp/gomodcache.sha256
          split -b 240M -d -a 2 /tmp/gomodcache.tar.gz /tmp/gomodcache.part.
          ls -lh /tmp/gomodcache.part.*
      - uses: actions/upload-artifact@v4
        with:
          name: pr1415-gomodcache-00
          path: |
            /tmp/gomodcache.part.00
            /tmp/gomodcache.sha256
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: pr1415-gomodcache-01
          path: /tmp/gomodcache.part.01
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: pr1415-gomodcache-02
          path: /tmp/gomodcache.part.02
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: pr1415-gomodcache-03
          path: /tmp/gomodcache.part.03
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0
