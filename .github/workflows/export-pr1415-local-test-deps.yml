name: Export PR 1415 local test dependencies

on:
  push:
    branches:
      - repair/pr1415-maintainer-review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.6
          cache: false
      - name: Assemble exact local test dependencies
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr1415-local-test-deps/internal/pricing/snapshot
          GOROOT=$(go env GOROOT)
          tar -C "$GOROOT" -czf /tmp/pr1415-local-test-deps/go1.26.6-linux-amd64.tar.gz .
          curl -fL \
            https://raw.githubusercontent.com/kenn-io/agentsview/db257992fb8e3048af8c1cec9da738c28b4fe603/litellm_snapshot.json.gz \
            -o /tmp/pr1415-local-test-deps/internal/pricing/snapshot/litellm_snapshot.json.gz
          echo '0e89b636ccf858edbf95a3f6188476b6eab6cf21f66d16a65c2184229ef81cbe  /tmp/pr1415-local-test-deps/internal/pricing/snapshot/litellm_snapshot.json.gz' | sha256sum -c -
          go mod download
          make sqlite-vec-header
          cp .sqlite-include/sqlite3.h /tmp/pr1415-local-test-deps/sqlite3.h
          GOMODCACHE=$(go env GOMODCACHE)
          tar -C "$(dirname "$GOMODCACHE")" -czf /tmp/pr1415-local-test-deps/gomodcache.tar.gz "$(basename "$GOMODCACHE")"
          go version
          sha256sum /tmp/pr1415-local-test-deps/go1.26.6-linux-amd64.tar.gz
          du -h /tmp/pr1415-local-test-deps/gomodcache.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: pr1415-local-test-deps
          path: /tmp/pr1415-local-test-deps
          retention-days: 1
          compression-level: 0
