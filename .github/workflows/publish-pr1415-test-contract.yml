name: Publish PR 1415 test-contract repair

on:
  push:
    branches:
      - repair/pr1415-maintainer-review
    paths:
      - .github/workflows/publish-pr1415-test-contract.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out immutable patch source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: patch-source
          fetch-depth: 1
          persist-credentials: false
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: stack/5-codex-staged-imports
          path: target
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact patch and fast-forward PR branch
        env:
          EXPECTED_BASE: a8db72557312c2f99822abb4adaca133a8bb9d35
          EXPECTED_PATCH_SHA256: 48a2d13cbdbe8204dd6025020baace61132886dd10b26fbb948769d905abe4fc
          EXPECTED_TREE: efa9af9a631f6353163bad9f4af8259658948207
        run: |
          set -euo pipefail
          patch="$GITHUB_WORKSPACE/patch-source/.github/pr1415/patches/lazy-checkpoint-test-contract.patch"
          echo "$EXPECTED_PATCH_SHA256  $patch" | sha256sum --check --strict

          cd "$GITHUB_WORKSPACE/target"
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          git config core.hooksPath /dev/null
          git apply --check "$patch"
          git apply "$patch"
          git diff --check

          actual_paths="$(git diff --name-only | sort)"
          expected_paths="$(printf '%s\n' \
            internal/db/staged_content_test.go \
            internal/sync/checkpoint_bootstrap_test.go | sort)"
          test "$actual_paths" = "$expected_paths"

          git add \
            internal/db/staged_content_test.go \
            internal/sync/checkpoint_bootstrap_test.go
          test "$(git write-tree)" = "$EXPECTED_TREE"

          git config user.name Shinn
          git config user.email 453821056@qq.com
          git commit -m "test(sync): align checkpoint recovery with lazy adoption"
          git push origin HEAD:refs/heads/stack/5-codex-staged-imports
