name: Export PR 1415 checkpoint test

on:
  push:
    branches:
      - repair/pr1415-maintainer-review
    paths:
      - .github/workflows/export-pr1415-checkpoint-test.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a8db72557312c2f99822abb4adaca133a8bb9d35
          persist-credentials: false
          fetch-depth: 1
      - name: Export source without repository metadata
        run: |
          set -euo pipefail
          tar --exclude=.git -czf /tmp/pr1415-a8db7255-source.tar.gz .
          sha256sum /tmp/pr1415-a8db7255-source.tar.gz > /tmp/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: pr1415-a8db7255-source
          path: |
            /tmp/pr1415-a8db7255-source.tar.gz
            /tmp/SHA256SUMS
          retention-days: 1
          compression-level: 0
