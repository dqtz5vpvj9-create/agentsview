name: Bench Gate

# Use the workflow version shipped with the PR. The upstream main branch no
# longer contains bench.yml, while this branch still carries its benchmark gate.
on:
  pull_request:
    # Docs/frontend-only PRs cannot change the gated Go paths. If
    # this check is ever made required on branch protection, pair it
    # with a no-op sibling workflow on the inverse paths.
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".github/workflows/bench.yml"
      - ".github/workflows/bench-pr.yml"
permissions: read-all

jobs:
  run:
    uses: ./.github/workflows/bench.yml
