name: Validate live transcript consistency

on:
  push:
    branches: [automation/live-transcript-rebase-20260923]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7e63e198d62ab92d58a7953dd876514742215f9c
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the exact rebased source
        run: |
          test "$(git rev-parse HEAD^{tree})" = de0779f172c5ee86a2383da24eb66db8ec7edabb
          git merge-base --is-ancestor 66dd6e5dc8fbb890d9eb21d64df952364abbd1c1 HEAD
          git diff 66dd6e5dc8fbb890d9eb21d64df952364abbd1c1 HEAD --check
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install pinned frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check types and transcript regressions
        working-directory: frontend
        run: |
          npm run check
          npm run test -- --maxWorkers=2 src/lib/virtual src/lib/components/content/staged-scroll src/lib/components/content/MessageList.test.ts src/lib/components/content/MessageList-search.test.ts
          npm run build
      - name: Build isolated application fixtures
        run: |
          mkdir -p /tmp/live-transcript-bin
          go run ./internal/pricing/cmd/litellm-snapshot -restore
          cp -r frontend/dist/. internal/web/dist/
          CGO_ENABLED=1 go build -tags 'fts5,kit_posthog_disabled' -o /tmp/live-transcript-bin/testfixture ./cmd/testfixture
          CGO_ENABLED=1 go build -tags 'fts5,kit_posthog_disabled' -o /tmp/live-transcript-bin/agentsview ./cmd/agentsview
      - name: Install browser engines
        working-directory: frontend
        run: npx playwright install --with-deps chromium webkit
      - name: Exercise application-level live refresh
        working-directory: frontend
        env:
          CI: 'true'
          E2E_PREBUILT_FIXTURE: /tmp/live-transcript-bin/testfixture
          E2E_PREBUILT_SERVER: /tmp/live-transcript-bin/agentsview
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json
        run: npx playwright test e2e/live-transcript-layout.spec.ts --workers=2 --retries=0 --reporter=list,html,json
      - name: Record the source identity
        if: always()
        run: |
          mkdir -p /tmp/live-transcript-results
          git log -4 --format='%H %s' > /tmp/live-transcript-results/commits.txt
          git status --short > /tmp/live-transcript-results/status.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-transcript-final-validation
          path: |
            /tmp/live-transcript-results
            frontend/playwright-report
            frontend/test-results
          retention-days: 3
