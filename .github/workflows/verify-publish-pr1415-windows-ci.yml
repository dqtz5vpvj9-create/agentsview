name: Verify and publish PR 1415 Windows CI repair

on:
  push:
    branches:
      - repair/pr1415-windows-ci
    paths:
      - .github/workflows/verify-publish-pr1415-windows-ci.yml

permissions:
  contents: read
  statuses: write

concurrency:
  group: verify-publish-pr1415-windows-ci
  cancel-in-progress: true

env:
  BASE_SHA: af72ec398d959fbfc91ec8e28677d1ee99045369
  PATCH_SHA256: 015cd43f6ba3c1bece6cdf0559ab59e7190222f2565363e2df61741b5f25de1f
  SNAPSHOT_SHA256: 0e89b636ccf858edbf95a3f6188476b6eab6cf21f66d16a65c2184229ef81cbe

jobs:
  parser:
    name: parser-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Mark parser verification pending
        uses: actions/github-script@v7
        env:
          STATUS_CONTEXT: pr1415-windows/parser-${{ matrix.os }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: process.env.STATUS_CONTEXT,
              description: 'parser verification running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: patch-source
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BASE_SHA }}
          path: target
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: target/go.mod
          cache: true
          cache-dependency-path: target/go.sum
      - name: Apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          cp patch-source/.github/pr1415/windows-ci.patch /tmp/pr1415-windows-ci.patch
          echo "$PATCH_SHA256  /tmp/pr1415-windows-ci.patch" | sha256sum --check --strict
          cd target
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git apply --check /tmp/pr1415-windows-ci.patch
          git apply /tmp/pr1415-windows-ci.patch
          git diff --check
          actual_paths="$(git diff --name-only | sort)"
          expected_paths="$(cat <<'PATHS' | sort
          internal/parser/codex.go
          internal/parser/codex_cursor_test.go
          internal/parser/codex_index_change_time_darwin.go
          internal/parser/codex_index_change_time_linux.go
          internal/parser/codex_index_change_time_other.go
          internal/parser/codex_index_change_time_windows.go
          internal/parser/codex_parser_test.go
          internal/parser/codex_provider.go
          internal/parser/codex_provider_test.go
          internal/parser/file_identity_path_unix.go
          internal/parser/file_identity_path_windows.go
          PATHS
          )"
          test "$actual_paths" = "$expected_paths"
          test -z "$(gofmt -l $actual_paths)"
      - name: Restore generated inputs
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          mkdir -p internal/pricing/snapshot
          curl --fail --location \
            https://raw.githubusercontent.com/kenn-io/agentsview/db257992fb8e3048af8c1cec9da738c28b4fe603/litellm_snapshot.json.gz \
            --output internal/pricing/snapshot/litellm_snapshot.json.gz
          echo "$SNAPSHOT_SHA256  internal/pricing/snapshot/litellm_snapshot.json.gz" | sha256sum --check --strict
          make sqlite-vec-header
      - name: Run parser tests
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          export CGO_CFLAGS="-I$PWD/.sqlite-include"
          go test -tags fts5 ./internal/parser -count=1 -timeout=25m
      - name: Run parser vet
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          export CGO_CFLAGS="-I$PWD/.sqlite-include"
          go vet -tags fts5 ./internal/parser
      - name: Publish parser verification result
        if: always()
        uses: actions/github-script@v7
        env:
          STATUS_CONTEXT: pr1415-windows/parser-${{ matrix.os }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: process.env.JOB_STATUS === 'success' ? 'success' : 'failure',
              context: process.env.STATUS_CONTEXT,
              description: `parser verification ${process.env.JOB_STATUS}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Mark docs verification pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'pr1415-windows/docs',
              description: 'docs verification running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - name: Verify fork asset branches and docs
        run: |
          set -euo pipefail
          git ls-remote --exit-code origin refs/heads/docs-assets
          git ls-remote --exit-code origin refs/heads/docs-generated-assets
          make docs-check
      - name: Publish docs verification result
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: process.env.JOB_STATUS === 'success' ? 'success' : 'failure',
              context: 'pr1415-windows/docs',
              description: `docs verification ${process.env.JOB_STATUS}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })

  publish:
    name: Fast-forward PR branch
    needs: [parser, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      statuses: write
    steps:
      - name: Mark publication pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'pr1415-windows/publish',
              description: 'publication running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: patch-source
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BASE_SHA }}
          path: target
          fetch-depth: 0
          persist-credentials: true
      - name: Commit tested repair and push
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          cp ../patch-source/.github/pr1415/windows-ci.patch /tmp/pr1415-windows-ci.patch
          echo "$PATCH_SHA256  /tmp/pr1415-windows-ci.patch" | sha256sum --check --strict
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git fetch origin refs/heads/stack/5-codex-staged-imports
          test "$(git rev-parse FETCH_HEAD)" = "$BASE_SHA"
          git config core.hooksPath /dev/null
          git apply --check /tmp/pr1415-windows-ci.patch
          git apply /tmp/pr1415-windows-ci.patch
          git diff --check
          git add internal/parser
          git config user.name Shinn
          git config user.email 453821056@qq.com
          git commit \
            -m "fix(codex): bind Windows checkpoints to open file handles" \
            -m "Capture file identity and NTFS change time from the exact descriptor being parsed, and make cross-platform cursor tests use the same path-versus-handle identity contract as production."
          git push origin HEAD:refs/heads/stack/5-codex-staged-imports
      - name: Publish publication result
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: process.env.JOB_STATUS === 'success' ? 'success' : 'failure',
              context: 'pr1415-windows/publish',
              description: `publication ${process.env.JOB_STATUS}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
