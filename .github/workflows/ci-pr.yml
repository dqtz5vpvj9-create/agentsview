name: CI

# Keep the upstream dispatcher pinned to its managed workflow. Forks use their
# local copy, whose runner expressions fall back to GitHub-hosted machines;
# upstream-only Namespace labels cannot service a fork's jobs.
on:
  pull_request:

permissions: read-all

jobs:
  run:
    if: github.repository == 'kenn-io/agentsview'
    uses: kenn-io/agentsview/.github/workflows/ci.yml@main

  fork:
    if: github.repository != 'kenn-io/agentsview'
    uses: ./.github/workflows/ci.yml
