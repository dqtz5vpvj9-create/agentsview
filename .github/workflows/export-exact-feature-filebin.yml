name: Publish exact in-session find source snapshot

on:
  push:
    branches:
      - automation/export-in-session-find-2

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/in-session-find
          fetch-depth: 0
      - name: Package and publish source tree
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git -czf /tmp/agentsview-feature-source.tar.gz .
          curl --fail --silent --show-error --retry 5 \
            -T /tmp/agentsview-feature-source.tar.gz \
            https://filebin.net/oai-agentsview-feature-20260903-e21c8d7a/agentsview-feature-source.tar.gz
          printf '%s\n' "${GITHUB_SHA}" | curl --fail --silent --show-error --retry 5 \
            -T - \
            https://filebin.net/oai-agentsview-feature-20260903-e21c8d7a/ready.txt
