name: Verify and publish unified PR 1415 repair

on:
  push:
    branches:
      - repair/pr1415-unified-derived-fix
    paths:
      - .github/workflows/verify-publish-pr1415-unified-derived.yml
      - .github/pr1415/unified_derived_fix.py

permissions:
  contents: read

env:
  BASE_SHA: 606112c385225251aa9b76c56aab0f78321de697
  SNAPSHOT_SHA256: 0e89b636ccf858edbf95a3f6188476b6eab6cf21f66d16a65c2184229ef81cbe

concurrency:
  group: verify-publish-pr1415-unified-derived
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        mode: [affected, race, full, bench]
    steps:
      - name: Check out immutable repair source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: repair-source
          persist-credentials: false
          fetch-depth: 1
      - name: Check out exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ env.BASE_SHA }}
          path: target
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-go@v6
        with:
          go-version-file: target/go.mod
          cache: true
          cache-dependency-path: target/go.sum
      - name: Apply unified repair
        env:
          TARGET: ${{ github.workspace }}/target
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = "$BASE_SHA"
          python repair-source/.github/pr1415/unified_derived_fix.py
          gofmt -w \
            target/internal/db/staged_content.go \
            target/internal/db/signal_maintenance.go \
            target/internal/db/signal_input_snapshot.go \
            target/internal/db/staged_metadata_republish_test.go \
            target/internal/db/signal_input_snapshot_test.go \
            target/internal/parser/codex.go \
            target/internal/parser/codex_parent_resolution_test.go \
            target/internal/signals/incremental.go \
            target/internal/signals/incremental_nil_maps_test.go \
            target/internal/sync/engine.go \
            target/internal/sync/signal_maintain.go \
            target/internal/sync/signal_nil_maps_test.go
          git -C target diff --check
          test -z "$(gofmt -l target/internal/db target/internal/parser target/internal/signals target/internal/sync)"
      - name: Restore generated inputs
        working-directory: target
        run: |
          set -euo pipefail
          mkdir -p internal/pricing/snapshot
          curl --fail --location \
            https://raw.githubusercontent.com/kenn-io/agentsview/db257992fb8e3048af8c1cec9da738c28b4fe603/litellm_snapshot.json.gz \
            --output internal/pricing/snapshot/litellm_snapshot.json.gz
          echo "$SNAPSHOT_SHA256  internal/pricing/snapshot/litellm_snapshot.json.gz" | sha256sum --check --strict
          make sqlite-vec-header
      - name: Affected packages and vet
        if: matrix.mode == 'affected'
        working-directory: target
        run: |
          set -euo pipefail
          go test -tags fts5 \
            ./internal/parser ./internal/db ./internal/signals ./internal/sync \
            -count=1 -timeout=35m
          go vet -tags fts5 \
            ./internal/parser ./internal/db ./internal/signals ./internal/sync
      - name: Race detector
        if: matrix.mode == 'race'
        working-directory: target
        run: |
          set -euo pipefail
          go test -race -tags fts5 \
            ./internal/parser ./internal/db ./internal/signals ./internal/sync \
            -count=1 -timeout=45m
      - name: Full repository tests
        if: matrix.mode == 'full'
        working-directory: target
        run: |
          set -euo pipefail
          go test -tags fts5 ./... -count=1 -timeout=60m
      - name: Benchmark gate
        if: matrix.mode == 'bench'
        working-directory: target
        run: make bench-gate

  publish:
    name: fast-forward PR branch
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out immutable repair source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: repair-source
          persist-credentials: false
          fetch-depth: 1
      - name: Check out exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ env.BASE_SHA }}
          path: target
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: target/go.mod
          cache: false
      - name: Recreate tested tree and publish
        env:
          TARGET: ${{ github.workspace }}/target
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = "$BASE_SHA"
          python repair-source/.github/pr1415/unified_derived_fix.py
          gofmt -w \
            target/internal/db/staged_content.go \
            target/internal/db/signal_maintenance.go \
            target/internal/db/signal_input_snapshot.go \
            target/internal/db/staged_metadata_republish_test.go \
            target/internal/db/signal_input_snapshot_test.go \
            target/internal/parser/codex.go \
            target/internal/parser/codex_parent_resolution_test.go \
            target/internal/signals/incremental.go \
            target/internal/signals/incremental_nil_maps_test.go \
            target/internal/sync/engine.go \
            target/internal/sync/signal_maintain.go \
            target/internal/sync/signal_nil_maps_test.go
          git -C target diff --check
          git -C target config user.name Shinn
          git -C target config user.email 453821056@qq.com
          git -C target add --all
          git -C target commit \
            -m "fix(sync): unify derived-state publication" \
            -m "Publish staged metadata-only refreshes without transcript churn, and bind full signal publication to the complete session metadata snapshot consumed by the computation." \
            -m "Keep empty incremental maps writable and leave zero-turn Codex parents unresolved until replay filtering can be proven."
          git -C target push origin HEAD:refs/heads/stack/5-codex-staged-imports
