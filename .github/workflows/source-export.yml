name: Frontend branch checks

on:
  push:
    branches:
      - automation/source-export

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/in-session-find
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod

      - name: Generate pricing snapshot
        run: go run ./internal/pricing/cmd/litellm-snapshot

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Type-check
        run: npm run check
        working-directory: frontend

      - name: Check design-system conformance
        run: npm run check:kit-ui
        working-directory: frontend

      - name: Run frontend tests
        run: npm test
        working-directory: frontend

      - name: Package local validation toolchain
        if: always()
        run: |
          node_root="$(dirname "$(dirname "$(command -v node)")")"
          tar -C "$node_root" -czf /tmp/node24.tar.gz .
          tar -C frontend -czf /tmp/frontend-node-modules.tar.gz node_modules

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-validation-toolchain
          path: |
            /tmp/node24.tar.gz
            /tmp/frontend-node-modules.tar.gz
          retention-days: 1
