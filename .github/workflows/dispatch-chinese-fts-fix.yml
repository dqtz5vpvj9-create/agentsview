name: One-shot Chinese FTS runtime guard

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: one-shot-chinese-fts-runtime-guard
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.title == '[ci] Run PR 1491 Chinese FTS runtime guard'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Report workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "Started validation run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: feature/chinese-fts
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Restore pricing snapshot
        run: go run ./internal/pricing/cmd/litellm-snapshot -restore

      - name: Apply runtime ownership guard
        run: |
          python3 scripts/normalize-chinese-fts-runtime-guard.py
          python3 scripts/apply-chinese-fts-runtime-guard.py
          python3 scripts/finalize-chinese-fts-runtime-guard.py
          rm scripts/normalize-chinese-fts-runtime-guard.py
          rm scripts/apply-chinese-fts-runtime-guard.py
          rm scripts/finalize-chinese-fts-runtime-guard.py
          rm .github/workflows/apply-chinese-fts-runtime-guard.yml
          go fmt ./...
          git diff --check

      - name: Vet Go packages
        env:
          CGO_ENABLED: "1"
        run: go vet -tags "fts5" ./...

      - name: Build pinned simple and cppjieba sidecar
        run: bash scripts/build-simple-fts.sh dist/agentsview-simple

      - name: Run database suite with Chinese FTS enabled
        env:
          AGENTSVIEW_SIMPLE_DIR: ${{ github.workspace }}/dist/agentsview-simple
          CGO_ENABLED: "1"
        run: go test -tags "fts5" ./internal/db -count=1 -timeout=25m

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(search): guard Chinese FTS runtime ownership"
          git push origin HEAD:feature/chinese-fts

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          STATUS: ${{ job.status }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "Validation finished with status **$STATUS**: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
