name: Publish reviewed PR 1415 local fix

on:
  push:
    branches:
      - repair/pr1415-maintainer-review
    paths:
      - .github/workflows/pr1415-publish-reviewed-local-fix.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out immutable patch source
        uses: actions/checkout@v4
        with:
          ref: repair/pr1415-maintainer-review
          path: patch-source
          fetch-depth: 1
          persist-credentials: false
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: stack/5-codex-staged-imports
          path: target
          fetch-depth: 0
          persist-credentials: true
      - name: Verify and publish fast-forward commit
        env:
          EXPECTED_BASE: c14a02b5be017d4bf43b7685a31eb09316aaf1d1
          EXPECTED_XZ_SHA256: dd593c6a5adedeca3d676c22770c7da8ceb32bffbe2ab87d0f36428ce62e504b
          EXPECTED_PATCH_SHA256: a60519bb0fb6bd7f793a3a5d96df4c85f1c9e38f6c7dd299170f7d7c442e9227
          EXPECTED_TREE: 9e125be861114a6cdb97946b6a77548567c28d70
        run: |
          set -euo pipefail
          cat patch-source/.github/pr1415/patches/fix-transactional-checkpoints.xz.b64.part.* > /tmp/pr1415.patch.xz.b64
          base64 --decode /tmp/pr1415.patch.xz.b64 > /tmp/pr1415.patch.xz
          echo "$EXPECTED_XZ_SHA256  /tmp/pr1415.patch.xz" | sha256sum --check --strict
          xz --decompress --stdout /tmp/pr1415.patch.xz > /tmp/pr1415.patch
          echo "$EXPECTED_PATCH_SHA256  /tmp/pr1415.patch" | sha256sum --check --strict
          cd target
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          git config core.hooksPath /dev/null
          git config user.name Shinn
          git config user.email 453821056@qq.com
          git am --3way /tmp/pr1415.patch
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test -z "$(git diff --name-only "$EXPECTED_BASE"..HEAD -- .github)"
          git push origin HEAD:refs/heads/stack/5-codex-staged-imports
