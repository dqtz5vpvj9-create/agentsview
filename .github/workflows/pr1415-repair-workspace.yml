name: PR 1415 test checkpoint lifecycle repair

on:
  push:
    branches:
      - repair/pr1415-maintainer-review
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Rebuild reviewed merge and apply checkpoint fix
        env:
          EXPECTED_REMOTE_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git remote add upstream https://github.com/kenn-io/agentsview.git
          git fetch upstream 866f7b69d484abe04decca69f202fb8e9df07a04
          git reset --hard c14a02b5be017d4bf43b7685a31eb09316aaf1d1
          git merge --no-ff 866f7b69d484abe04decca69f202fb8e9df07a04 \
            -m "Merge upstream main into PR 1415 repair branch" || true
          python - <<'PY'
          from pathlib import Path

          def replace_conflicts(path, resolver):
              p = Path(path)
              text = p.read_text()
              out = []
              pos = 0
              index = 0
              while True:
                  start = text.find("<<<<<<< HEAD\n", pos)
                  if start < 0:
                      out.append(text[pos:])
                      break
                  middle = text.find("=======\n", start)
                  end = text.find(">>>>>>> upstream/main\n", middle)
                  if middle < 0 or end < 0:
                      raise RuntimeError(f"malformed conflict in {path}")
                  out.append(text[pos:start])
                  ours = text[start + len("<<<<<<< HEAD\n"):middle]
                  theirs = text[middle + len("=======\n"):end]
                  out.append(resolver(index, ours, theirs))
                  pos = end + len(">>>>>>> upstream/main\n")
                  index += 1
              p.write_text("".join(out))

          replace_conflicts(
              "docs/internal/performance-gates.md",
              lambda index, ours, theirs: ours + (
                  "- `TestCountDuplicatePromptsAllocationGrowthStaysNearLinear`\n"
                  "  (`internal/signals/heuristics_test.go`) — session-quality analysis must not\n"
                  "  rebuild token sets for every pair of user prompts.\n"
              ),
          )

          replace_conflicts(
              "internal/sync/s3.go",
              lambda index, ours, theirs: ours + theirs,
          )

          def resolve_engine(index, ours, theirs):
              if index == 0:
                  return ours.replace(
                      "\t\t\tif file.ForceParse &&\n",
                      "\t\t\tif (file.ForceParse || file.ForceFullParse) &&\n",
                  )
              if index == 1:
                  return (
                      "\tif cacheSkip && !e.forceParseBypassesCache(file) &&\n"
                      "\t\t!codexForceFullParse && !codexAuditDeepVerify {\n"
                  )
              if index == 2:
                  ours = ours.replace(
                      "\t// the transcript size. Small files keep the collecting path.\n",
                      "\t// the transcript size. Small files keep the collecting path. Parse-diff\n"
                      "\t// uses e.forceParse and must keep the collecting representation so its\n"
                      "\t// comparison never observes staged placeholders.\n",
                  )
                  ours = ours.replace(
                      "\t\tif e.forceParse || file.ForceParse {\n",
                      "\t\tif e.forceParseRequested(file) {\n",
                  )
                  ours = ours.replace(
                      "\t\t\tForceParse:  e.forceParse || file.ForceParse,\n",
                      "\t\t\tForceParse:  e.forceParseRequested(file),\n",
                  )
                  return ours
              raise RuntimeError(f"unexpected engine conflict {index}")

          replace_conflicts("internal/sync/engine.go", resolve_engine)
          PY
          git add docs/internal/performance-gates.md internal/sync/engine.go internal/sync/s3.go
          test -z "$(git diff --name-only --diff-filter=U)"
          git commit --no-edit
          test "$(git rev-parse 'HEAD^{tree}')" = \
            404fdc2a1238ffb7d410b0a03e82dd185fe59e93
          cat > /tmp/checkpoint.patch.gz.b64 <<'PATCH'

PATCH
          base64 -d /tmp/checkpoint.patch.gz.b64 | gzip -d > /tmp/checkpoint.patch
          git am /tmp/checkpoint.patch
          git diff --check
      - name: Run focused Go tests
        run: |
          go test ./internal/db ./internal/parser ./internal/sync
      - name: Publish tested repair branch
        env:
          EXPECTED_REMOTE_HEAD: ${{ github.sha }}
        run: |
          git push --force-with-lease=refs/heads/repair/pr1415-maintainer-review:${EXPECTED_REMOTE_HEAD} \
            origin HEAD:refs/heads/repair/pr1415-maintainer-review
