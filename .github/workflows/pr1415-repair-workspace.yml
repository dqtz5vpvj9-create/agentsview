name: PR 1415 export current merge conflicts

on:
  push:
    branches:
      - repair/pr1415-maintainer-review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reproduce merge against current upstream main
        run: |
          set -u
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git remote add upstream https://github.com/kenn-io/agentsview.git
          git fetch upstream main:refs/remotes/upstream/main
          git reset --hard c14a02b5be017d4bf43b7685a31eb09316aaf1d1
          git merge --no-ff upstream/main -m "Merge upstream main into PR 1415 repair branch" || true
          git status --short > /tmp/merge-status.txt
          cp /tmp/merge-status.txt .pr1415-merge-status.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pr1415-current-merge-conflicts
          path: .
          include-hidden-files: true
          retention-days: 1
          compression-level: 6
