name: One-shot PR 1495 history cleanup

on:
  pull_request_target:
    types: [reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: one-shot-pr1495-history-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event.pull_request.title == '[ci] Run PR 1495 compact review repair'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Report workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "Started PR 1495 history cleanup: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build clean branch on latest upstream main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/kenn-io/agentsview.git
          git fetch upstream main
          git fetch origin draft/db-compact
          git checkout -B pr1495-clean upstream/main
          git merge --squash origin/draft/db-compact
          test ! -e .github/scripts/compact-review
          test ! -e .github/workflows/apply-compact-review.yml
          git diff --check

      - name: Restore pricing snapshot
        run: go run ./internal/pricing/cmd/litellm-snapshot -restore

      - name: Run compaction-focused tests
        run: |
          go test ./internal/db
          go test ./internal/server
          go test -tags fts5 ./cmd/agentsview -run 'Compact' -count=1
          go test -tags fts5 ./cmd/agentsview -run '^$'

      - name: Commit and replace draft branch
        env:
          EXPECTED_HEAD: b1acd288b70cf32d0a469c9f4fb3026b5d458ba0
        run: |
          git add -A
          git commit -m "feat(db): add staged SQLite archive compaction"
          git push \
            --force-with-lease=refs/heads/draft/db-compact:$EXPECTED_HEAD \
            origin HEAD:refs/heads/draft/db-compact

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          STATUS: ${{ job.status }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "PR 1495 history cleanup finished with status **$STATUS**: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
