name: Verify PR 1415 four-package regression suite

on:
  push:
    branches:
      - repair/pr1415-maintainer-review
    paths:
      - .github/workflows/verify-pr1415-four-packages.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 09b43810514e9b511dd0ba4156ea655f1c379621
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.6
          cache: true
      - name: Prepare SQLite header
        run: make sqlite-vec-header
      - name: Run affected packages
        run: |
          set -euo pipefail
          go test -tags fts5 \
            ./internal/parser \
            ./internal/db \
            ./internal/signals \
            ./internal/sync \
            -count=1 -timeout=30m
