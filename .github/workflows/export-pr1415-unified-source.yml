name: Export PR 1415 unified-fix source

on:
  push:
    branches:
      - repair/pr1415-unified-derived-fix
    paths:
      - .github/workflows/export-pr1415-unified-source.yml

permissions:
  contents: read
  statuses: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 606112c385225251aa9b76c56aab0f78321de697
          fetch-depth: 1
          persist-credentials: false
      - name: Export source tree
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr1415-unified-source
          tar --exclude=.git -cf - . | tar -C /tmp/pr1415-unified-source -xf -
          printf '%s\n' 606112c385225251aa9b76c56aab0f78321de697 > /tmp/pr1415-unified-source/BASE_SHA
          curl --fail-with-body \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/$SHA" \
            --data "$(jq -n \
              --arg state success \
              --arg target_url "$RUN_URL" \
              --arg description 'PR 1415 unified-fix source exported' \
              --arg context 'pr1415-unified-source' \
              '{state:$state,target_url:$target_url,description:$description,context:$context}')"
      - uses: actions/upload-artifact@v4
        with:
          name: pr1415-unified-source
          path: /tmp/pr1415-unified-source
          retention-days: 1
          compression-level: 0
