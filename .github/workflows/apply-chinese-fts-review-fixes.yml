name: Apply Chinese FTS review fixes

on:
  push:
    branches: [feature/chinese-fts]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-chinese-fts-review-fixes
  cancel-in-progress: false

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/chinese-fts
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Apply review fixes
        run: |
          python scripts/apply-chinese-fts-review-fixes.py
          gofmt -w \
            internal/db/chinese_fts_runtime.go \
            internal/db/chinese_fts_search.go \
            internal/db/chinese_fts_test.go \
            internal/db/db.go \
            internal/db/sqlite_driver.go
          rm scripts/apply-chinese-fts-review-fixes.py
          rm .github/workflows/apply-chinese-fts-review-fixes.yml
          git diff --check

      - name: Build pinned simple and cppjieba sidecar
        run: bash scripts/build-simple-fts.sh dist/agentsview-simple

      - name: Run Chinese FTS integration tests
        env:
          AGENTSVIEW_SIMPLE_DIR: ${{ github.workspace }}/dist/agentsview-simple
          CGO_ENABLED: "1"
        run: |
          go test -tags fts5 ./internal/db \
            -run 'Test(ContainsCJK|DiscoverSimpleFTSRuntime|ChineseFTS)' \
            -count=1 -v -timeout=10m

      - name: Run database test suite with the sidecar loaded
        env:
          AGENTSVIEW_SIMPLE_DIR: ${{ github.workspace }}/dist/agentsview-simple
          CGO_ENABLED: "1"
        run: go test -tags fts5 ./internal/db -count=1 -timeout=20m

      - name: Commit tested fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(search): harden Chinese FTS lifecycle"
          git push origin HEAD:feature/chinese-fts
