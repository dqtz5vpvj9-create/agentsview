name: Verify exact repaired PR 1415 head

on:
  push:
    branches:
      - repair/pr1415-maintainer-review
    paths:
      - .github/workflows/pr1415-verify-a8.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dqtz5vpvj9-create/agentsview
          ref: a8db72557312c2f99822abb4adaca133a8bb9d35
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Restore exact pricing snapshot
        run: |
          set -euo pipefail
          mkdir -p internal/pricing/snapshot
          curl -fL \
            https://raw.githubusercontent.com/kenn-io/agentsview/db257992fb8e3048af8c1cec9da738c28b4fe603/litellm_snapshot.json.gz \
            -o internal/pricing/snapshot/litellm_snapshot.json.gz
          echo '0e89b636ccf858edbf95a3f6188476b6eab6cf21f66d16a65c2184229ef81cbe  internal/pricing/snapshot/litellm_snapshot.json.gz' | sha256sum -c -
      - name: Prepare SQLite build
        run: make sqlite-vec-header
      - name: Test affected packages
        run: |
          go test -tags fts5 ./internal/parser ./internal/db ./internal/signals ./internal/sync -count=1 -timeout=30m
      - name: Vet affected packages
        run: |
          go vet -tags fts5 ./internal/parser ./internal/db ./internal/signals ./internal/sync
      - name: Verify quiet-append signal benchmark gate
        run: |
          go test -tags fts5 ./internal/sync \
            -run '^$' \
            -bench '^BenchmarkCodexQuietAppendSignals500$' \
            -benchtime=3x \
            -count=1 \
            -timeout=15m
