name: Export Go 1.26.5 toolchain

on:
  push:
    branches:
      - repair/pr1415-maintainer-review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache: false
      - name: Package installed toolchain
        run: |
          set -euo pipefail
          go version
          GOROOT=$(go env GOROOT)
          tar -C "$GOROOT" -czf /tmp/go1.26.5-linux-amd64.tar.gz .
          sha256sum /tmp/go1.26.5-linux-amd64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: go1.26.5-linux-amd64
          path: /tmp/go1.26.5-linux-amd64.tar.gz
          retention-days: 1
          compression-level: 0
